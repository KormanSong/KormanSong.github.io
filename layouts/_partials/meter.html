{{- /* Level meter (0 to 4). The blocks are only a visual aid. The number, or "Not rated" for screen readers, carries the meaning. */ -}}
{{- $n := . | int -}}
<span class="meter" aria-hidden="true">{{ range seq 4 }}<i{{ if le . $n }} class="on"{{ end }}></i>{{ end }}</span>
{{- if gt $n 0 }}<span class="lv">{{ $n }}</span>{{ else }}<span class="vh">{{ T "not_rated" }}</span>{{ end -}}
