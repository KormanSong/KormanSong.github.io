<header class="site-head frame">
  <a class="site-name" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
  <nav class="site-nav" aria-label="주요 메뉴">
    <ul>
      {{- $page := . }}
      {{- range site.Menus.main }}
      {{- $current := "" }}
      {{- if $page.IsMenuCurrent "main" . }}{{ $current = "page" }}{{ else if $page.HasMenuCurrent "main" . }}{{ $current = "true" }}{{ end }}
      <li><a href="{{ .URL }}"{{ with $current }} aria-current="{{ . }}"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
