{{ define "main" }}

    <p class="lede">
      {{- if eq .Data.Plural "tags" }}이 태그가 붙은 글 {{ len .Pages }}편{{ else }}이 분류에 속한 글 {{ len .Pages }}편{{ end -}}
    </p>
  </div>

{{- range .Pages }}

{{- end }}
{{ end }}
