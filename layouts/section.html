{{ define "main" }}
<header class="row page-head">
  <div class="main">
    <h1>{{ partial "kotext.html" .Title }}</h1>
    {{- with .Content }}
    <div class="lede">{{ partial "kotext.html" . }}</div>
    {{- end }}
  </div>
</header>

{{- range .Pages.ByDate.Reverse }}
{{ partial "post-row.html" (dict "page" . "h" 2) }}
{{- else }}
<div class="row"><p class="main">{{ T "no_posts" }}</p></div>
{{- end }}
{{ end }}
