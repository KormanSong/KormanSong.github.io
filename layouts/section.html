{{ define "main" }}
<header class="row page-head">
  <div class="main">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}
    <div class="lede">{{ . }}</div>
    {{- end }}
  </div>
</header>

{{- range .Pages.ByDate.Reverse }}
{{ partial "post-row.html" (dict "page" . "h" 2) }}
{{- else }}
<div class="row"><p class="main">아직 올린 글이 없습니다.</p></div>
{{- end }}
{{ end }}
