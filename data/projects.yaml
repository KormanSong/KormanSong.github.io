# 프로젝트 목록. 첫 화면의 '진행 중인 프로젝트'와 /projects/ 페이지가 이 파일에서 만들어집니다.
#
# status    now(진행 중) | planned(예정) | done(완료)
# since     시작 연월, YYYY-MM (선택). 왼쪽 날짜 열에 표시됩니다.
# stack     사용한 칩, 도구, 기술
# summary   한두 문장의 설명 (주로 예정 항목에 사용)
# did       작업 내용
# broke     문제. 이 항목에는 노란색 표시가 붙습니다.
# fixed     해결 방법
# next      다음 계획
# post      관련 글의 경로. content/ 기준이며 확장자는 쓰지 않습니다.
#
# 항목은 개조식(명사형 종결)으로 씁니다. 사용하지 않는 항목은 지우십시오.

- title: FreeRTOS 카운터의 이벤트 기반 재설계
  status: now
  since: "2026-10"
  stack: [STM32, FreeRTOS, 7세그먼트 동적 구동]
  did: 디스플레이·카운터 태스크 분리, `vTaskDelayUntil`로 1초 주기 고정, 버튼 A/B 사양을 상태 전이표로 재정의
  broke: 디스플레이 태스크가 자릿수마다 전역 변수를 다시 읽어 표시값이 깨질 수 있음. 블로킹 호출이 없어 유휴(idle) 태스크가 실행되지 않음
  next: 프레임마다 값을 한 번만 복사, 2 ms 주기 블로킹, 주기가 짧은 태스크에 높은 우선순위 부여. 이후 슈퍼루프, FreeRTOS, 동기식 구현 비교
  post: posts/2026-10-21-task-is-a-unit-of-waiting

