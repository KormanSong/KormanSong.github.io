# 스킬 맵 데이터. /skill-map/ 페이지가 이 파일 하나에서 만들어집니다.
#
# level     0 = 평가 전, 1~4 = 아래 levels 기준. 방어할 수 있는 등급만 적습니다.
# note      항목 아래 작게 붙는 설명 (선택)
# evidence  근거가 되는 글의 경로. content/ 기준, 확장자 없이.
#           예: posts/2026-10-21-task-is-a-unit-of-waiting
#
# 3등급 이상인데 evidence가 비어 있으면 페이지에 노란 표시등과 "근거 없음"이 뜹니다.
# evidence 경로가 틀리면 "글을 찾을 수 없음"이 뜹니다.

levels:
  - n: 1
    meaning: 벤더 드라이버나 HAL을 호출해 봤다
    ask: 어떤 API를 어떤 순서로 불렀나
  - n: 2
    meaning: 레지스터를 직접 설정했거나 드라이버를 썼다
    ask: 어떤 레지스터를, 왜 그 값으로 설정했나
  - n: 3
    meaning: 스코프나 로직 분석기로 파형을 보며 디버깅했고, 에러와 타이밍을 다뤘다
    ask: 어떤 파형을 봤고, 무엇이 잘못돼 있었나
  - n: 4
    meaning: 프로토콜이나 구조를 설계했고, 남에게 설명해서 적용시켰다
    ask: 왜 그렇게 설계했고, 대안은 무엇이었나

# 칩과 가까운 것부터 제품과 일하는 방식 쪽으로 정렬합니다.
groups:
  - name: MCU와 개발 도구
    items:
      - name: ARM Cortex-M (bare-metal)
        level: 0
        note: 스타트업 코드, 벡터 테이블, 링커 스크립트
      - name: C (임베디드, MISRA 일부)
        level: 0
      - name: GCC, Make, CMake
        level: 0
      - name: JTAG/SWD 디버깅
        level: 0
        note: OpenOCD, J-Link 등
      - name: 오실로스코프, 로직 분석기
        level: 0

  - name: 주변장치
    items:
      - name: GPIO, EXTI
        level: 0
      - name: 타이머, PWM, 입력 캡처
        level: 0
      - name: ADC
        level: 0
        note: 센서 입력 경로. 오버샘플링, 캘리브레이션
      - name: DAC
        level: 0
        note: 밸브와 액추에이터 출력 경로
      - name: DMA
        level: 0
      - name: Flash, EEPROM
        level: 0
        note: 캘리브레이션 값 저장
      - name: Watchdog
        level: 0

  - name: 통신
    items:
      - name: UART
        level: 0
      - name: RS-485
        level: 0
        note: 반이중, 송수신 방향 제어
      - name: SPI
        level: 0
      - name: I2C
        level: 0
      - name: CAN
        level: 0
      # 실제로 써 본 프로토콜 이름으로 바꾸세요.
      - name: 산업용 필드버스
        level: 0
        note: EtherCAT, Modbus 등
      - name: USB
        level: 0
        note: CDC 등

  - name: 시스템 소프트웨어
    items:
      - name: FreeRTOS
        level: 0
        note: 태스크, 큐, 태스크 알림
        evidence: posts/2026-10-21-task-is-a-unit-of-waiting
      - name: 이벤트 기반 상태기계
        level: 0
      - name: 부트로더, 펌웨어 업데이트
        level: 0
      - name: 임베디드 리눅스
        level: 1
        note: BeagleBone Black, Device Tree. 커널 직접 빌드 진행 중
      - name: 리눅스 커널 드라이버 (IIO)
        level: 0
        note: 예정

  - name: 유량 제어
    items:
      - name: 질량 유량 제어기(MFC) 펌웨어
        level: 0
        note: 반도체 공정 장비용
      - name: PID 제어 루프
        level: 0
      - name: 센서 캘리브레이션, 선형화
        level: 0
      - name: 실시간 제약
        level: 0
        note: 지터, 마감 시간

  - name: 일하는 방식
    items:
      - name: 타깃 밖 단위 테스트
        level: 0
        note: 하드웨어 없이 PC에서 로직 테스트
      - name: Git, 코드 리뷰
        level: 0
      - name: 영어 기술 문서
        level: 0
        note: 이 블로그
