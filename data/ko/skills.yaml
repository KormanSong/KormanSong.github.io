# 한국어 페이지용 보유 기술 데이터. 필드 설명은 data/en/skills.yaml 머리말 참고.
# level과 evidence는 영문 파일과 같은 값으로 유지.

levels:
  - n: 1
    meaning: 제조사 라이브러리(HAL)와 드라이버 API로 기능을 구현함
    ask: 호출한 API와 호출 순서
  - n: 2
    meaning: 레지스터를 직접 설정하거나 드라이버를 작성함
    ask: 설정한 레지스터와 각 값을 정한 이유
  - n: 3
    meaning: 오실로스코프나 로직 분석기로 결함·타이밍 문제의 원인을 찾아 해결함
    ask: 측정한 파형과 문제 원인
  - n: 4
    meaning: 팀에서 쓰는 통신 프로토콜이나 소프트웨어 구조를 설계함
    ask: 설계 이유와 검토 후 채택하지 않은 대안

groups:
  - name: MCU 코어와 메모리
    items:
      - name: Arm Cortex-M(베어메탈)
        short: Cortex-M
        area: core
        cpu: true
        level: 0
        note: 스타트업 코드, 벡터 테이블, 링커 스크립트
      - name: DMA
        area: core
        level: 0
        note: 직접 메모리 접근
      - name: 플래시·EEPROM
        short: 플래시/EEPROM
        area: core
        level: 0
        note: 교정 데이터 저장
      - name: 워치독 타이머
        short: 워치독
        area: core
        level: 0

  - name: 입출력
    items:
      - name: ADC
        area: io
        io: 유량 센서
        io_dir: in
        level: 0
        note: 아날로그-디지털 변환기. 센서 입력, 오버샘플링
      - name: DAC
        area: io
        io: 제어 밸브
        io_dir: out
        level: 0
        note: 디지털-아날로그 변환기. 밸브 구동 출력
      - name: 타이머, PWM, 입력 캡처
        short: 타이머/PWM
        area: io
        level: 0
      - name: GPIO, 외부 인터럽트
        short: GPIO/EXTI
        area: io
        level: 0

  - name: 통신
    items:
      - name: UART
        area: comm
        level: 0
        note: 비동기 직렬 통신
      - name: RS-485
        area: comm
        io: 상위 제어기
        io_dir: both
        level: 0
        note: 반이중. 송수신 방향 전환 제어
      - name: SPI
        area: comm
        level: 0
      - name: I2C
        area: comm
        level: 0
      - name: CAN
        area: comm
        level: 0
      # 실제로 사용한 프로토콜 이름으로 바꿀 것.
      - name: 산업용 필드버스
        short: 필드버스
        area: comm
        level: 0
        note: EtherCAT, DeviceNet, Modbus 등
      - name: USB
        area: comm
        level: 0
        note: CDC 클래스 등

  - name: 펌웨어
    items:
      - name: C
        area: software
        level: 0
        note: 임베디드 C
      - name: FreeRTOS
        area: software
        level: 0
        note: 태스크, 큐, 태스크 알림
        evidence: posts/2026-10-21-task-is-a-unit-of-waiting
      - name: 유한 상태 머신(FSM)
        short: 상태 머신
        area: software
        level: 0
        note: 이벤트 기반 설계
      - name: 부트로더, 펌웨어 업데이트
        short: 부트로더
        area: software
        level: 0

  - name: 유량 제어
    items:
      - name: 질량유량제어기(MFC) 펌웨어
        short: MFC 펌웨어
        area: domain
        level: 0
        note: 반도체 장비용
      - name: PID 제어
        area: domain
        level: 0
        note: 유량 제어 루프
      - name: 센서 교정·선형화
        short: 교정
        area: domain
        level: 0
      - name: 실시간 제약
        short: 실시간
        area: domain
        level: 0
        note: 지터, 마감 시간

  - name: 개발·측정 도구
    items:
      - name: GCC, Make, CMake
        short: GCC/Make
        area: tools
        slot: build
        level: 0
      - name: JTAG/SWD 디버깅
        short: JTAG/SWD
        area: tools
        slot: debug
        level: 0
        note: OpenOCD, J-Link 등
      - name: 오실로스코프, 로직 분석기
        short: 계측기
        area: tools
        slot: probe
        level: 0

  - name: 임베디드 리눅스
    items:
      - name: 리눅스 커널·루트 파일 시스템 빌드
        short: 커널 빌드
        area: next
        level: 1
        note: BeagleBone Black, 디바이스 트리. 진행 중
      - name: 리눅스 커널 드라이버(IIO)
        short: 커널 드라이버
        area: next
        level: 0
        note: 예정

  - name: 테스트·협업·문서화
    items:
      - name: 호스트 PC 단위 테스트
        level: 0
        note: 하드웨어 없이 로직 검증
      - name: Git, 코드 리뷰
        level: 0
      - name: 영문 기술 문서 작성
        level: 0
        note: 이 블로그의 영문판
