# Skills data. The diagram and the tables on /skill-map/ both come from this file.
#
# level     0 = not rated. 1 to 4 = see "levels" below. Give a level only if you can show evidence for it.
# note      Short text under the skill name in the table (optional).
# evidence  Path of a post that proves the level, relative to content/, without the file extension.
#           Example: posts/2026-10-21-task-is-a-unit-of-waiting
#
# Fields for the diagram (an MCU block diagram)
# area      Where the block goes. If you leave it out, the skill shows only in the table.
#           domain (application, inside the core)   software (firmware, inside the core)
#           core (memory and system, below the core)   io (I/O, left of the chip)
#           comm (communication, right of the chip)    tools (outside the chip)   next (Linux SoC)
# cpu       true = this item is the core itself (the title row of the core box).
# slot      Position of a tool: build | debug (debug port) | probe (measurement probe)
# short     Short label for the diagram. If empty, the diagram uses "name".
#           A label that is too wide for its block gets a smaller font.
# io        The external device that connects to this block, for example "Flow sensor".
# io_dir    in | out | both
#
# If a skill has level 3 or higher and no evidence, the diagram and the table show a "No evidence" flag.
# If the evidence path is wrong, the table shows "Post not found".

levels:
  - n: 1
    meaning: Used vendor HAL or driver APIs
    ask: Which APIs I called, and in what order
  - n: 2
    meaning: Set registers directly, or wrote a driver
    ask: Which registers I set, and why I chose each value
  - n: 3
    meaning: Found and fixed faults or timing problems with an oscilloscope or logic analyzer
    ask: Which waveform I captured, and what caused the problem
  - n: 4
    meaning: Designed a protocol or an architecture that my team uses
    ask: Why I chose the design, and which alternatives I rejected

# Table order: hardware (core, I/O, communication) → firmware → application → tools → new areas → ways of working
