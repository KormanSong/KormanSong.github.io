# Firmware Notes
# 테마 없이 이 저장소의 layouts/ 와 assets/ 만으로 만들어집니다.

baseURL = "https://kormansong.github.io/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "Firmware Notes"
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Seoul"

[params]
  description = "반도체 장비용 유량 제어기 펌웨어 엔지니어의 작업 기록. 측정한 것, 막힌 곳, 고친 방법."
  author = "KormanSong"
  github = "https://github.com/KormanSong"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # 글 안에 HTML(예: <p lang="en">)을 쓸 수 있게
  [markup.highlight]
    noClasses = false      # 코드 색은 assets/css/main.css 에서 직접 정함
    codeFences = true
    guessSyntax = false
    lineNos = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[minify]
  minifyOutput = true

[[menus.main]]
  name = "글"
  pageRef = "/posts"
  weight = 10
[[menus.main]]
  name = "스킬 맵"
  pageRef = "/skill-map"
  weight = 20
[[menus.main]]
  name = "프로젝트"
  pageRef = "/projects"
  weight = 30
[[menus.main]]
  name = "소개"
  pageRef = "/about"
  weight = 40
