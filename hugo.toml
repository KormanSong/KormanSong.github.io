# Firmware Notes
# This site uses no theme. Everything comes from layouts/, assets/, data/, and i18n/.

baseURL = "https://kormansong.github.io/"
title = "Firmware Notes"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Seoul"
titleCaseStyle = "none"   # Keep titles as written (sentence case).

[params]
  author = "KormanSong"
  github = "https://github.com/KormanSong"

# English is the source language. Korean will be a translation of the English text.
# To publish Korean, add the translated files (see README) and set disabled = false.
[languages]
  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 1
    [languages.en.params]
      description = "Firmware development notes for mass flow controllers (MFCs) in semiconductor equipment. Measurements, problems, and solutions."
    [[languages.en.menus.main]]
      name = "Posts"
      pageRef = "/posts"
      weight = 10
    [[languages.en.menus.main]]
      name = "Skills"
      pageRef = "/skill-map"
      weight = 20
    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 30
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 40

  [languages.ko]
    locale = "ko-KR"
    label = "한국어"
    weight = 2
    disabled = true
    [languages.ko.params]
      description = "반도체 장비용 질량 유량 제어기(MFC) 펌웨어 개발 기록. 측정 결과와 문제 해결 과정."
    [[languages.ko.menus.main]]
      name = "글"
      pageRef = "/posts"
      weight = 10
    [[languages.ko.menus.main]]
      name = "기술 역량"
      pageRef = "/skill-map"
      weight = 20
    [[languages.ko.menus.main]]
      name = "프로젝트"
      pageRef = "/projects"
      weight = 30
    [[languages.ko.menus.main]]
      name = "소개"
      pageRef = "/about"
      weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # Allows HTML inside posts, for example the flow figure.
  [markup.highlight]
    noClasses = false      # Code colors are set in assets/css/main.css.
    codeFences = true
    guessSyntax = false
    lineNos = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]

[minify]
  minifyOutput = true
